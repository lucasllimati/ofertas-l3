# Atualizações agrupadas: no máximo 1 PR por ecossistema por semana para minor/patch.
# Versões major continuam vindo em PR separado, para você decidir.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /worker
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      worker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
