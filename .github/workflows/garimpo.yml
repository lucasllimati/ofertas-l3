# Execuções do Garimpo. Um único job processa todos os nichos em sequência.
# Horários em UTC (Brasília = UTC-3). Se mudar publish_slots no config/niches.yaml, mude o cron de publish aqui.
# Ao ativar um nicho com Telegram, inclua a linha <REF>_CHAT_ID no bloco env do passo "garimpo".
name: garimpo

on:
  schedule:
    - cron: "7 8 * * *" # daily   05:07 BRT: coleta, score, conteúdo e prévias para aprovação
    - cron: "7 11,15,22 * * *" # publish 08:07, 12:07, 19:07 BRT
    - cron: "7 0 * * *" # publish 21:07 BRT
    - cron: "37 1 * * *" # report  22:37 BRT: cliques, conversões e relatório diário
    - cron: "17 6 * * 0" # backup  domingo 03:17 BRT: histórico criptografado (AES-256) como artefato
  workflow_dispatch:
    inputs:
      steps:
        description: "O que rodar"
        type: choice
        options: [healthcheck, daily, publish, report, close, backup] # close = fechamento do mês anterior
        default: healthcheck
      run_date:
        description: "Dia a (re)processar, AAAA-MM-DD (vazio = hoje)"
        required: false
        default: ""
      niche:
        description: "Só este nicho (vazio = todos)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: garimpo-db # nunca duas execuções ao mesmo tempo no banco
  cancel-in-progress: false

jobs:
  # Trava de produção: só roda código cujo commit exato passou no ci e no security.
  # Sem isso, um push direto na main (sem proteção de branch no plano Free) iria para produção sem verificação.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: commit passou em ci e security
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "ci" or .name == "security") | {name, status, conclusion}]')
            ok() { echo "$runs" | jq --arg n "$1" '[.[] | select(.name == $n and .conclusion == "success")] | length'; }
            if [ "$(ok ci)" -gt 0 ] && [ "$(ok security)" -gt 0 ]; then
              echo "commit $SHA verificado: ci e security verdes"
              exit 0
            fi
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$pending" -eq 0 ]; then break; fi
            echo "ci/security ainda rodando para $SHA; aguardando ($attempt/24)"
            sleep 30
          done
          echo "::error::o commit $SHA não passou em ci e security; produção não roda código não verificado"
          echo "$runs"
          exit 1
      - name: avisar no Telegram que a produção foi bloqueada
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then exit 0; fi
          text="⛔ Produção bloqueada: o commit ${SHA:0:7} não passou em ci/security. Nada foi coletado nem publicado. Veja: $RUN_URL"
          curl -sS --fail -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" --data-urlencode "text=${text}" \
            || echo "::warning::não foi possível avisar no Telegram"

  run:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: garimpo
        id: garimpo
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STEPS: ${{ inputs.steps }}
          RUN_DATE: ${{ inputs.run_date }}
          NICHE: ${{ inputs.niche }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS }}
          APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          REDIRECT_BASE_URL: ${{ secrets.REDIRECT_BASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          GARIMPO_REHEARSAL: ${{ vars.GARIMPO_REHEARSAL }} # 1 = ensaio: posts só no seu chat (SETUP §13.1)
          TG_CASA_CHAT_ID: ${{ secrets.TG_CASA_CHAT_ID }}
          TG_PET_CHAT_ID: ${{ secrets.TG_PET_CHAT_ID }}
          TG_GERAL_CHAT_ID: ${{ secrets.TG_GERAL_CHAT_ID }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            steps="$INPUT_STEPS"
          else
            case "$SCHEDULE" in
              "7 8 * * *") steps=daily ;;
              "37 1 * * *") steps=report ;;
              "17 6 * * 0") steps=backup ;;
              *) steps=publish ;;
            esac
          fi
          args=(--steps "$steps")
          if [ -n "$RUN_DATE" ]; then args+=(--run-date "$RUN_DATE"); fi
          if [ -n "$NICHE" ]; then args+=(--niche "$NICHE"); fi
          echo "steps=$steps" | tee -a "$GITHUB_OUTPUT"
          if [ "$steps" = "backup" ] && [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE não configurado: backup não será gerado em texto puro"
            exit 1
          fi
          uv run --no-dev python -m src.run "${args[@]}"
      - name: criptografar backup
        if: steps.garimpo.outputs.steps == 'backup'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          shopt -s nullglob
          files=(out/backup/*.jsonl.gz)
          [ ${#files[@]} -gt 0 ] || { echo "::error::nenhum backup gerado"; exit 1; }
          for f in "${files[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f" <<< "$BACKUP_PASSPHRASE"
            shred -u "$f"
          done
      - name: guardar backup (90 dias)
        if: steps.garimpo.outputs.steps == 'backup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-${{ github.run_id }}
          path: out/backup/*.gpg
          retention-days: 90
          if-no-files-found: error
