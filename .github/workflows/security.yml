name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # segunda 06:17 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: # RLS e permissões só existem em Postgres: esses testes não podem ser pulados
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks varre o histórico inteiro
          persist-credentials: false
      - name: gitleaks (histórico completo)
        # Binário oficial com checksum conferido: não precisa de token nem de permissão extra.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit
        run: uv run pip-audit
      - name: semgrep
        run: uvx semgrep==1.180.0 scan --error --metrics=off --config p/python --config p/typescript --config p/github-actions
      - name: workflows (SHA, permissions, pull_request_target)
        run: uv run python scripts/check_workflows.py
      - name: inventário de segredos
        run: uv run python scripts/check_secrets_inventory.py
      - name: suíte de segurança e regras de anúncio (SQLite)
        run: uv run pytest -m security
      - name: suíte de segurança e regras de anúncio (Postgres, RLS e permissões)
        run: uv run pytest -m security
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
          REQUIRE_POSTGRES: "1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit
        working-directory: worker
        run: npm ci --ignore-scripts && npm audit --audit-level=high && npm test
