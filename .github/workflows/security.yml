name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # segunda 06:17 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks varre o histórico inteiro
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit
        run: uv run pip-audit
      - name: semgrep
        run: uvx semgrep==1.180.0 scan --error --metrics=off --config p/python --config p/typescript --config p/github-actions
      - name: workflows (SHA, permissions, pull_request_target)
        run: uv run python scripts/check_workflows.py
      - name: inventário de segredos
        run: uv run python scripts/check_secrets_inventory.py
      - name: testes de segurança (open redirect, assinatura, autorização)
        run: |
          uv run pytest tests/test_security.py
          uv run pytest tests/test_approval_publish.py tests/test_content.py -k "signature or unauthorized or escape"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit
        working-directory: worker
        run: npm ci --ignore-scripts && npm audit --audit-level=high && npm test
