# Workflow reutilizável: um único job processa todos os nichos em sequência.
# Ao adicionar um nicho com Telegram, inclua a linha <REF>_CHAT_ID no bloco env abaixo.
name: _run

on:
  workflow_call:
    inputs:
      steps:
        required: true
        type: string
      run_date:
        required: false
        type: string
        default: ""
      niche:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: garimpo-db # nunca duas execuções ao mesmo tempo no banco
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: garimpo
        env:
          STEPS: ${{ inputs.steps }}
          RUN_DATE: ${{ inputs.run_date }}
          NICHE: ${{ inputs.niche }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS }}
          APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          REDIRECT_BASE_URL: ${{ secrets.REDIRECT_BASE_URL }}
          TG_CASA_CHAT_ID: ${{ secrets.TG_CASA_CHAT_ID }}
          TG_PET_CHAT_ID: ${{ secrets.TG_PET_CHAT_ID }}
          TG_GERAL_CHAT_ID: ${{ secrets.TG_GERAL_CHAT_ID }}
        run: |
          args=(--steps "$STEPS")
          if [ -n "$RUN_DATE" ]; then args+=(--run-date "$RUN_DATE"); fi
          if [ -n "$NICHE" ]; then args+=(--niche "$NICHE"); fi
          uv run --no-dev python -m src.run "${args[@]}"
