[project]
name = "garimpo-engine"
version = "0.5.0"
description = "Sistema de afiliados multi-nicho: Shopee -> score -> conteúdo -> aprovação -> Telegram"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1",
    "httpx>=0.28",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert em testes
    "S311",  # random só para exploração, não para segurança
    "S608",  # SQL montado só com nomes fixos; valores sempre parametrizados
    "SIM105",  # try/except/pass explícito é mais legível aqui
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp --strict-markers"
markers = ["security: suíte de segurança e de regras de anúncio (rodada pelo security.yml)"]
